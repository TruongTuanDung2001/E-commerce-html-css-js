<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project E-commerce</title>
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <!-- link cdn font-awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="header__container">
        <div class="header__logo">
          <img
            src="https://i.pinimg.com/736x/83/23/fb/8323fb6664afa3079a41049992c91051.jpg"
            alt="logo"
          />
        </div>
        <div class="header__nav">
          <ul class="list-item">
            <li class="item"><a href="#">Home</a></li>
            <li class="item">
              <a href="#">Products</a>
              <ul class="nav__dropdown-product">
                <li class="item-product"><a href="#">Trending</a></li>
                <li class="item-product"><a href="#">Best-selling</a></li>
                <li class="item-product"><a href="#">Sales</a></li>
              </ul>
            </li>
            <li class="item"><a href="#">Contact</a></li>
          </ul>
        </div>
        <div class="header__action">
          <div class="header__cart">
            <a href="#">
              <i class="fa-solid fa-cart-shopping"></i>
            </a>
          </div>
          <div class="header__profile">
            <a href="#">
              <i class="fa-regular fa-user"></i>
            </a>
          </div>
          <div class="header__login"></div>
        </div>
      </div>
    </header>

    <!-- home -->
    <div class="container">
      <section class="home">
        <div class="home__container">
          <div class="home__slider">
            <div class="slider__wrapper">
              <img
                src="/assets/images/banners/home.jpg"
                class="slider__image active"
                alt="Pet banner 1"
              />
              <img
                src="/assets/images/banners/home2.jpg"
                class="slider__image"
                alt="Pet banner 2"
              />
              <img
                src="/assets/images/banners/home3.jpg"
                class="slider__image"
                alt="Pet banner 3"
              />
              <img
                src="/assets/images/banners/home4.jpg"
                class="slider__image"
                alt="Pet banner 4"
              />
            </div>

            <button
              class="slider__btn slider__prev"
              aria-label="Previous slide"
            >
              &#10094;
            </button>

            <button class="slider__btn slider__next" aria-label="Next slide">
              &#10095;
            </button>

            <div class="slider__dots"></div>
          </div>

          <div class="home__right">
            <div class="home__pets">
              <div class="pet-item">
                <img src="/assets/images/meme/dog.jpg" alt="Dog" />
              </div>

              <div class="pet-item">
                <img src="/assets/images/meme/cat3.jpg" alt="Cat" />
              </div>

              <div class="pet-item">
                <img src="/assets/images/meme/food for animal.jpg" alt="Rabbit" />
              </div>
            </div>

            <div class="home__content">
              <span class="home__subtitle">WELCOME TO PET WORLD</span>

              <h2>Love Your Pets, Care For Them</h2>

              <p>
                Discover everything your lovely pets need. From quality food to
                adorable accessories, we bring happiness and care to every
                little friend.
              </p>

              <a href="#products" class="home__button">
                Explore Products
                <span>&rarr;</span>
              </a>
            </div>
          </div>
        </div>
      </section>
    </div>



    <!-- script -->
     <script src="./js/main.js"></script>
  </body>
</html>
