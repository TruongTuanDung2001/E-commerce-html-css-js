<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project E-commerce</title>
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <!-- link cdn font-awesome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  </head>
  <body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <img src="https://i.pinimg.com/736x/83/23/fb/8323fb6664afa3079a41049992c91051.jpg" alt="logo">
            </div>
            <div class="header__nav">
                <ul class="list-item">
                    <li class="item">Home</li>
                    <li class="item">Products</li>
                    <li class="item">Contact</li>
                </ul>
            </div>
            <div class="header__action">
                <div class="header__cart"><i class="fa-solid fa-cart-shopping"></i></div>
                <div class="header__profile"><i class="fa-regular fa-user"></i></div>
                <div class="header__login"></div>
            </div>
        </div>
    </header>
  </body>
</html>
