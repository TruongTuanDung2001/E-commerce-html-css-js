<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products Page</title>
    <!-- links -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/products.css" />
  </head>
  <body>
    <!-- Header -->
    <div id="header"></div>

    <!-- Main -->
    <main class="products-page">
      <!-- SIDEBAR FILTER -->
      <aside class="filter-sidebar">
        <div class="filter-header">
          <h2>Filters</h2>
          <button id="resetFilter">Reset</button>
        </div>

        <!-- PRICE FILTER -->
        <div class="filter-group">
          <h3>Price Range</h3>

          <div class="price-values">
            <span id="minPrice">0đ</span>
            <span id="maxPrice">2.000.000đ</span>
          </div>

          <input
            type="range"
            id="priceRange"
            min="0"
            max="2000000"
            step="50000"
            value="2000000"
          />
        </div>

        <!-- CATEGORY FILTER -->
        <div class="filter-group">
          <h3>Categories</h3>

          <div class="category-list">
            <label>
              <input type="checkbox" value="Dog Food" class="category-filter" />
              <span>Dog Food</span>
            </label>

            <label>
              <input type="checkbox" value="Cat Food" class="category-filter" />
              <span>Cat Food</span>
            </label>

            <label>
              <input type="checkbox" value="Toys" class="category-filter" />
              <span>Toys</span>
            </label>

            <label>
              <input
                type="checkbox"
                value="Accessories"
                class="category-filter"
              />
              <span>Accessories</span>
            </label>

            <label>
              <input
                type="checkbox"
                value="Healthcare"
                class="category-filter"
              />
              <span>Healthcare</span>
            </label>
          </div>
        </div>

        <!-- WISHLIST FILTER -->
        <div class="filter-group wishlist-filter">
          <h3>Wishlist</h3>

          <label>
            <input type="checkbox" id="wishlistOnly" />
            <span>Favorites only</span>
          </label>
        </div>

        <button class="apply-filter" id="applyFilter">Apply Filters</button>
      </aside>

      <!-- PRODUCTS CONTENT -->
      <section class="products-content">
        <!-- SEARCH HEADER -->
        <div class="products-top">
          <div class="products-heading">
            <span>PET SHOP COLLECTION</span>
            <h1>Our Products</h1>
            <p>Find the best products for your lovely pets.</p>
          </div>

          <div class="search-sort">
            <div class="search-box">
              <span>⌕</span>
              <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
              />
            </div>

            <select id="sortProducts">
              <option value="default">Sort By</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
              <option value="name">Name: A - Z</option>
            </select>
          </div>
        </div>

        <!-- RESULT COUNT -->
        <div class="products-result">
          <p>Showing <strong id="resultCount">24</strong> products</p>
        </div>

        <!-- PRODUCT GRID -->
        <div class="products-grid" id="productsGrid">
          <!-- Products generated by JavaScript -->
        </div>

        <!-- EMPTY STATE -->
        <div class="empty-products" id="emptyProducts">
          <h3>No products found!</h3>
          <p>Try changing your search or filters.</p>
        </div>

        <!-- PAGINATION -->
        <div class="pagination" id="pagination">
          <button class="page-btn prev-page" id="prevPage">&laquo;</button>

          <div class="page-numbers" id="pageNumbers"></div>

          <button class="page-btn next-page" id="nextPage">&raquo;</button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
    <!-- script -->
    <script src="./js/data/products.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/components/header.js"></script>
  </body>
</html>
